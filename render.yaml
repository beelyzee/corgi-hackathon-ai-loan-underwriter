services:
  - type: web
    name: corgi-hackathon-ai-loan-underwriter
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PIPESHIFT_MODEL
        value: moonshotai/Kimi-K2.6
      - key: PIPESHIFT_API_BASE
        value: https://api.pipeshift.com/api/v0
